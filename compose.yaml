services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stellar_inspector
      POSTGRES_USER: stellar
      POSTGRES_PASSWORD: stellar
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stellar -d stellar_inspector"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - stellar_postgres_data:/var/lib/postgresql/data

  sentinel-api:
    build:
      context: ./services/sentinel-api
    environment:
      DATABASE_URL: postgres://stellar:stellar@postgres:5432/stellar_inspector?sslmode=disable
      SENTINEL_ADDRESS: :8080
      SENTINEL_ALLOWED_ORIGINS: ${SENTINEL_ALLOWED_ORIGINS:-http://localhost:3000}
      SENTINEL_AUTH_TOKENS: ${SENTINEL_AUTH_TOKENS:-}
      SENTINEL_SESSION_SECRET: ${SENTINEL_SESSION_SECRET:-}
      SENTINEL_SESSION_TTL: ${SENTINEL_SESSION_TTL:-12h}
      SENTINEL_COOKIE_SECURE: ${SENTINEL_COOKIE_SECURE:-false}
      SENTINEL_RATE_LIMIT_WINDOW: ${SENTINEL_RATE_LIMIT_WINDOW:-1m}
      SENTINEL_RATE_LIMIT_IP: ${SENTINEL_RATE_LIMIT_IP:-120}
      SENTINEL_RATE_LIMIT_ACCOUNT: ${SENTINEL_RATE_LIMIT_ACCOUNT:-30}
      SENTINEL_TRUSTED_PROXY_CIDRS: ${SENTINEL_TRUSTED_PROXY_CIDRS:-}
      SENTINEL_LOG_LEVEL: ${SENTINEL_LOG_LEVEL:-info}
      SENTINEL_ENVIRONMENT: ${SENTINEL_ENVIRONMENT:-development}
      SENTINEL_VERSION: ${SENTINEL_VERSION:-dev}
      SENTINEL_ALERT_RETENTION: ${SENTINEL_ALERT_RETENTION:-2160h}
      SENTINEL_OPERATION_RETENTION: ${SENTINEL_OPERATION_RETENTION:-720h}
      SENTINEL_RETENTION_INTERVAL: ${SENTINEL_RETENTION_INTERVAL:-1h}
      SENTINEL_NOTIFICATION_TIMEOUT: ${SENTINEL_NOTIFICATION_TIMEOUT:-10s}
      SENTINEL_NOTIFICATION_POLL: ${SENTINEL_NOTIFICATION_POLL:-2s}
      SENTINEL_NOTIFICATION_MAX_ATTEMPTS: ${SENTINEL_NOTIFICATION_MAX_ATTEMPTS:-5}
      SENTINEL_WEBHOOK_URL: ${SENTINEL_WEBHOOK_URL:-}
      SENTINEL_WEBHOOK_SECRET: ${SENTINEL_WEBHOOK_SECRET:-}
      SENTINEL_TELEGRAM_BOT_TOKEN: ${SENTINEL_TELEGRAM_BOT_TOKEN:-}
      SENTINEL_TELEGRAM_CHAT_ID: ${SENTINEL_TELEGRAM_CHAT_ID:-}
      SENTINEL_TELEGRAM_API_URL: ${SENTINEL_TELEGRAM_API_URL:-https://api.telegram.org}
      SENTINEL_SMTP_HOST: ${SENTINEL_SMTP_HOST:-}
      SENTINEL_SMTP_PORT: ${SENTINEL_SMTP_PORT:-587}
      SENTINEL_SMTP_USERNAME: ${SENTINEL_SMTP_USERNAME:-}
      SENTINEL_SMTP_PASSWORD: ${SENTINEL_SMTP_PASSWORD:-}
      SENTINEL_SMTP_FROM: ${SENTINEL_SMTP_FROM:-}
      SENTINEL_SMTP_TO: ${SENTINEL_SMTP_TO:-}
      SENTINEL_SMTP_TLS: ${SENTINEL_SMTP_TLS:-starttls}
      HORIZON_TESTNET_URL: https://horizon-testnet.stellar.org
    ports:
      - "${SENTINEL_HOST_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SENTINEL_API_URL: ${NEXT_PUBLIC_SENTINEL_API_URL:-http://localhost:8081}
    restart: unless-stopped
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      - sentinel-api

volumes:
  stellar_postgres_data:

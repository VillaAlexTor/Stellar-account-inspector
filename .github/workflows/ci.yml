name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sentinel-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/sentinel-api/go.mod
          cache-dependency-path: services/sentinel-api/go.sum
      - run: gofmt -d .
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: stellar_inspector
          POSTGRES_USER: stellar
          POSTGRES_PASSWORD: stellar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stellar -d stellar_inspector"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/sentinel-api/go.mod
          cache-dependency-path: services/sentinel-api/go.sum
      - name: PostgreSQL + Horizon SSE + browser SSE + notifications
        working-directory: services/sentinel-api
        env:
          SENTINEL_INTEGRATION_DATABASE_URL: postgres://stellar:stellar@localhost:5432/stellar_inspector?sslmode=disable
        run: go test -tags=integration ./internal/integration -count=1 -v

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: services/sentinel-api
          push: false
          tags: stellar-sentinel-api:ci
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: stellar-sentinel-web:ci

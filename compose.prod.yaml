name: stellar-account-inspector

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stellar_inspector
      POSTGRES_USER: stellar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stellar -d stellar_inspector"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - stellar_postgres_data:/var/lib/postgresql/data
    networks: [backend]

  sentinel-api:
    build:
      context: ./services/sentinel-api
    image: ${SENTINEL_API_IMAGE:-stellar-sentinel-api:local}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://stellar:${POSTGRES_PASSWORD}@postgres:5432/stellar_inspector?sslmode=disable
      SENTINEL_ADDRESS: :8080
      SENTINEL_ENVIRONMENT: production
      SENTINEL_VERSION: ${SENTINEL_VERSION:-local}
      SENTINEL_ALLOWED_ORIGINS: https://${DOMAIN:?define DOMAIN}
      SENTINEL_AUTH_TOKENS: ${SENTINEL_AUTH_TOKENS:?define SENTINEL_AUTH_TOKENS}
      SENTINEL_SESSION_SECRET: ${SENTINEL_SESSION_SECRET:?define SENTINEL_SESSION_SECRET}
      SENTINEL_COOKIE_SECURE: "true"
      SENTINEL_TRUSTED_PROXY_CIDRS: 172.30.0.0/24
      SENTINEL_RATE_LIMIT_WINDOW: ${SENTINEL_RATE_LIMIT_WINDOW:-1m}
      SENTINEL_RATE_LIMIT_IP: ${SENTINEL_RATE_LIMIT_IP:-120}
      SENTINEL_RATE_LIMIT_ACCOUNT: ${SENTINEL_RATE_LIMIT_ACCOUNT:-30}
      SENTINEL_ALERT_RETENTION: ${SENTINEL_ALERT_RETENTION:-2160h}
      SENTINEL_OPERATION_RETENTION: ${SENTINEL_OPERATION_RETENTION:-720h}
      SENTINEL_RETENTION_INTERVAL: ${SENTINEL_RETENTION_INTERVAL:-1h}
      SENTINEL_WEBHOOK_URL: ${SENTINEL_WEBHOOK_URL:-}
      SENTINEL_WEBHOOK_SECRET: ${SENTINEL_WEBHOOK_SECRET:-}
      SENTINEL_TELEGRAM_BOT_TOKEN: ${SENTINEL_TELEGRAM_BOT_TOKEN:-}
      SENTINEL_TELEGRAM_CHAT_ID: ${SENTINEL_TELEGRAM_CHAT_ID:-}
      SENTINEL_SMTP_HOST: ${SENTINEL_SMTP_HOST:-}
      SENTINEL_SMTP_PORT: ${SENTINEL_SMTP_PORT:-587}
      SENTINEL_SMTP_USERNAME: ${SENTINEL_SMTP_USERNAME:-}
      SENTINEL_SMTP_PASSWORD: ${SENTINEL_SMTP_PASSWORD:-}
      SENTINEL_SMTP_FROM: ${SENTINEL_SMTP_FROM:-}
      SENTINEL_SMTP_TO: ${SENTINEL_SMTP_TO:-}
      SENTINEL_SMTP_TLS: ${SENTINEL_SMTP_TLS:-starttls}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SENTINEL_API_URL: ""
    image: ${SENTINEL_WEB_IMAGE:-stellar-sentinel-web:local}
    restart: unless-stopped
    networks: [backend]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?define DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?define ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [sentinel-api, web]
    networks: [backend]

networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  stellar_postgres_data:
  caddy_data:
  caddy_config:

services:
  alloy:
    image: grafana/alloy:latest
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      SENTINEL_METRICS_TOKEN: ${SENTINEL_METRICS_TOKEN:?define SENTINEL_METRICS_TOKEN}
      GRAFANA_CLOUD_PROM_URL: ${GRAFANA_CLOUD_PROM_URL:?define GRAFANA_CLOUD_PROM_URL}
      GRAFANA_CLOUD_PROM_USER: ${GRAFANA_CLOUD_PROM_USER:?define GRAFANA_CLOUD_PROM_USER}
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL:?define GRAFANA_CLOUD_LOKI_URL}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER:?define GRAFANA_CLOUD_LOKI_USER}
      GRAFANA_CLOUD_API_KEY: ${GRAFANA_CLOUD_API_KEY:?define GRAFANA_CLOUD_API_KEY}
    volumes:
      - ./deploy/observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - sentinel-api
    networks:
      - backend

volumes:
  alloy_data:
